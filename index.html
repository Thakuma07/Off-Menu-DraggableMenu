<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Off/Menu Animation | thakuma.dev</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="main-container">
        <div class="menu-drop-zone"></div>

        <div class="menu-drawer">
            <div class="menu-logo">
                <img src="./assets/logo.svg" alt="" />
            </div>

            <div class="menu-items">
                <div class="menu-item">
                    <a href="/work">Work</a>
                </div>
                <div class="menu-item">
                    <a href="/manifesto">manifesto</a>
                </div>
                <div class="menu-item">
                    <a href="/contact">Contact</a>
                </div>
            </div>

            <div class="menu-toggler">
                <span></span>
                <span></span>
            </div>
        </div>

        <section class="hero">
            <video autoplay muted loop playsinline class="hero-video">
                <source src="./assets/hero-video.webm" type="video/webm">
            </video>
            <div class="hero-content">
                <h1>Designing Brands and Interfaces Worth Remembering</h1>
                <div class="hero-btns">
                    <a href="#" class="btn btn-primary">Get Started &rarr;</a>
                    <a href="#" class="btn btn-secondary">View Pricing &rarr;</a>
                </div>
            </div>
        </section>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
    <script src="./script.js"></script>
</body>

</html>
